name = "chat-cifrado"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Páginas estáticas (chat em /, com gerador de chaves em Configurar)
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

# Uma instância de Durable Object por sala
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
